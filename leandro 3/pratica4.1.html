<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Função Quadrado</title>
</head>
<body>

    <h1>Abra o Console do Desenvolvedor</h1>
    <p>Pressione <strong>F12</strong> (ou clique com o botão direito e escolha "Inspecionar") e vá até a aba <strong>Console</strong> para ver o resultado.</p>

    <script>
        // Declaração da função
        function quadrado(numero) {
          return numero * numero;
        }

        // Chamada da função, armazenamento e exibição do resultado
        const x = quadrado(4);
        console.log(x);
    </script>

</body>
</html>

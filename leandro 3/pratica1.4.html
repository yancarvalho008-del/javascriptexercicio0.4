<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campo de Senha com Olhinho</title>
    <!-- Ícones do Bootstrap para o desenho do olho -->
    <link rel="stylesheet" href="https://jsdelivr.net">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }

        .password-container {
            position: relative;
            width: 300px;
        }

        .password-container input {
            width: 100%;
            padding: 10px 40px 10px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #666;
            font-size: 18px;
        }
        
        .toggle-password:hover {
            color: #333;
        }
    </style>
</head>
<body>

    <div class="password-container">
        <input type="password" id="password" placeholder="Digite sua senha">
        <!-- Ícone inicial de olho fechado -->
        <i class="bi bi-eye-slash toggle-password" id="togglePassword"></i>
    </div>

    <script>
        const passwordInput = document.getElementById('password');
        const togglePasswordButton = document.getElementById('togglePassword');

        togglePasswordButton.addEventListener('click', () => {
            // Verifica o tipo atual do input
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            
            // Alterna a classe do ícone entre olho aberto e fechado
            togglePasswordButton.classList.toggle('bi-eye');
            togglePasswordButton.classList.toggle('bi-eye-slash');
        });
    </script>

</body>
</html>

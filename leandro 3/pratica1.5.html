<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Range Slider Dinâmico</title>
    <style>
        .slider-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 300px;
            margin: 50px auto;
            font-family: Arial, sans-serif;
        }
        #slider-value {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="slider-container">
    <!-- O número que aparece em cima da barra -->
    <div id="slider-value">50</div>
    
    <!-- A barra de range -->
    <input type="range" id="my-slider" min="0" max="100" value="50">
</div>

<script>
    // Seleciona os elementos do DOM
    const slider = document.getElementById('my-slider');
    const sliderValue = document.getElementById('slider-value');

    // Atualiza o texto com o valor atual do input
    slider.addEventListener('input', (event) => {
        sliderValue.textContent = event.target.value;
    });
</script>

</body>
</html>

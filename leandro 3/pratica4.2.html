<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste da Expressão de Função</title>
</head>
<body>

    <h1>Verifique o Console do Navegador</h1>
    <p>Pressione <strong>F12</strong> (ou Inspecionar) e abra a aba <strong>Console</strong> para ver o resultado de <em>x</em>.</p>

    <script>
        // Expressão de função
        var quadrado = function(numero) {
            return numero * numero;
        };

        // Execução da função e atribuição a x
        var x = quadrado(4);
        
        // Confirmação no console do navegador
        console.log("O valor de x é:", x);
    </script>

</body>
</html>
